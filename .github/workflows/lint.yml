name: lint

on:
  push:
    branches: [main]
    paths:
      - 'compose/**'
      - 'nginx/**'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'compose/**'
      - 'nginx/**'

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # compose 里引用了 ${MYSQL_*}，这里给假值让校验能过
      - name: 校验 compose 语法
        env:
          MYSQL_ROOT_PASSWORD: dummy
          MYSQL_PASSWORD: dummy
        run: docker compose -f compose/docker-compose.yml config -q

      - name: 校验 nginx 配置
        run: |
          docker run --rm \
            -v "$PWD/nginx/conf.d:/etc/nginx/conf.d:ro" \
            nginx:1.27-alpine nginx -t
